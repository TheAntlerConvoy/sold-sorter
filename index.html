<html lang="en">

<title>Sold Sorter</title>
<meta name="description" content="Sold Sorter is a browser extension that sorts eBay search and category results by number sold.">
<style>
  :root { --bg: #ffffff; --fg: #1d2422; --muted: #5b6663; --accent: #0f6e63; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #171c1b; --fg: #e8eeec; --muted: #a5b1ad; --accent: #3fb3a3; color-scheme: dark; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 30px; margin: 0 0 8px; }
  a { color: var(--accent); }
  .muted { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Sold Sorter</h1>
  <p>Sold Sorter is a Chrome extension that sorts eBay search and category results by number sold and shows the sold count on every listing.</p>

</main>
</body>
</html>
